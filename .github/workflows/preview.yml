name: Deploy preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: npm run build

      - name: Validate
        run: npm run check

      - name: Make preview noindex
        run: |
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
          printf '/*\n  X-Robots-Tag: noindex, nofollow\n' > dist/_headers

      - name: Deploy workers.dev preview
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx --yes wrangler@4 deploy --config wrangler.preview.jsonc

      - name: Cloudflare credentials missing
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "::error::Cloudflare preview was not deployed because CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are not available to this repository."
          exit 1
